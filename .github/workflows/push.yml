name: Check
on: [push]
permissions:
  contents: read
jobs:
  Web-Test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-web
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm -r build
  Deploy-Check:
    runs-on: ubuntu-latest
    needs: [Web-Test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-web
      - name: Build Checker
        run: pnpm build
        working-directory: Web/packages/check
      - name: Publish
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: Web/packages/check
          packageManager: pnpm
      - name: Fix permissions of `.wrangler`. See https://github.com/shumbo/Svadilfari/issues/44
        run: sudo chown -R $(id -un):$(id -gn) ${{ github.workspace }}
  Deploy-Go:
    runs-on: ubuntu-latest
    needs: [Web-Test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-web
      - name: Publish
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: Web/packages/go
          packageManager: pnpm
      - name: Fix permissions of `.wrangler`. See https://github.com/shumbo/Svadilfari/issues/44
        run: sudo chown -R $(id -un):$(id -gn) ${{ github.workspace }}
